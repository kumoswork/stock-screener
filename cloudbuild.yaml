# Optional Cloud Build pipeline. Prefer: .\scripts\deploy_cloudrun.ps1
# Example:
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_SERVICE=kumo-screener,_REGION=asia-northeast3

substitutions:
  _SERVICE: kumo-screener
  _REGION: asia-northeast3
  _MEMORY: 1Gi
  _REPO: cloud-run-source-deploy

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --memory=${_MEMORY}
      - --cpu=1
      - --timeout=300
      - --concurrency=40
      - --min-instances=0
      - --max-instances=3
      - --port=8000

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
