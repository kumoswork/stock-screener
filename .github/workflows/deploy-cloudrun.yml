# main push → Cloud Run 자동 배포 (서울, scale-to-zero)
# 최초 1회: GitHub Secrets 설정 (docs/cloudrun-github-actions.md)

name: deploy-cloudrun

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudrun
  cancel-in-progress: true

permissions:
  contents: read

env:
  GCP_REGION: asia-northeast3
  CLOUD_RUN_SERVICE: kumo-screener

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check required secrets
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          missing=0
          if [ -z "${GCP_PROJECT_ID}" ]; then
            echo "::error::Missing secret GCP_PROJECT_ID (e.g. stockscreener-504006)"
            missing=1
          fi
          if [ -z "${GCP_SA_KEY}" ]; then
            echo "::error::Missing secret GCP_SA_KEY — paste the FULL github-sa-key.json contents (starts with {)"
            missing=1
          elif ! printf '%s' "${GCP_SA_KEY}" | head -c1 | grep -q '{'; then
            echo "::error::GCP_SA_KEY must be the full JSON key file, not a file path"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Required secrets present."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        env:
          PORTFOLIO_TOKEN: ${{ secrets.PORTFOLIO_GITHUB_TOKEN }}
        run: |
          ENV_VARS="GITHUB_REPO=kumoswork/stock-screener"
          if [ -n "${PORTFOLIO_TOKEN}" ]; then
            ENV_VARS="GITHUB_TOKEN=${PORTFOLIO_TOKEN},${ENV_VARS}"
          fi
          gcloud run deploy "${{ env.CLOUD_RUN_SERVICE }}" \
            --source . \
            --region "${{ env.GCP_REGION }}" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --platform managed \
            --allow-unauthenticated \
            --memory 1Gi \
            --cpu 1 \
            --timeout 300 \
            --concurrency 40 \
            --min-instances 0 \
            --max-instances 3 \
            --port 8000 \
            --set-env-vars "${ENV_VARS}" \
            --quiet

      - name: Show service URL
        run: |
          URL="$(gcloud run services describe "${{ env.CLOUD_RUN_SERVICE }}" \
            --region "${{ env.GCP_REGION }}" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --format 'value(status.url)')"
          echo "Deployed: ${URL}"
          echo "Health: ${URL}/health"
