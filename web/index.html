<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>KUMO$ 종목 스크리너</title>
  <link rel="icon" href="/assets/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="/assets/favicon.png" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="brand">
          <img src="/assets/kumo_logo.png" alt="KUMO$" class="brand-logo" />
        </div>
        <button type="button" class="sidebar-close" id="sidebar-close" aria-label="사이드바 닫기" title="사이드바 닫기">‹</button>
      </div>

      <nav class="tabs" role="tablist">
        <button type="button" class="tab" data-mode="search">종목 검색</button>
        <button type="button" class="tab active" data-mode="filter">필터 검색</button>
        <button type="button" class="tab" data-mode="favorites">즐겨찾기</button>
      </nav>

      <div class="sidebar-body" id="sidebar-body">
        <div class="panel" id="panel-search" hidden>
          <label class="field-label" for="stock-q">종목명 / 코드</label>
          <input id="stock-q" type="search" placeholder="삼성전자, 005930…" autocomplete="off" />
          <ul id="stock-suggest" class="suggest" hidden></ul>
          <p id="stock-picked" class="picked muted"></p>
          <button type="button" class="btn primary" id="btn-search">조회</button>
        </div>

        <div class="panel" id="panel-filter">
          <div class="market-row">
            <span class="field-label">시장</span>
            <div class="seg" id="market-seg">
              <button type="button" data-market="ALL" class="active">전체</button>
              <button type="button" data-market="KOSPI">코스피</button>
              <button type="button" data-market="KOSDAQ">코스닥</button>
            </div>
          </div>
          <div id="abs-filters" class="filter-block"></div>
          <div id="filter-list" class="filter-block"></div>
        </div>

        <div class="panel" id="panel-favorites" hidden>
          <p class="muted" id="fav-panel-copy">별(☆)을 누르거나 이 탭을 열면 포트폴리오 로그인이 필요합니다. 이름 + 숫자 4자리.</p>
          <div id="fav-session" class="fav-session" hidden>
            <p class="fav-session-name">포트폴리오 <strong id="fav-name-label"></strong></p>
            <button type="button" class="btn" id="btn-portfolio-logout">로그아웃</button>
          </div>
          <button type="button" class="btn primary" id="btn-portfolio-login" hidden>로그인 / 만들기</button>
        </div>

        <p class="meta-cap" id="meta-cap"></p>
      </div>

      <div class="filter-actions" id="filter-actions">
        <button type="button" class="btn" id="btn-reset">필터 초기화</button>
        <button type="button" class="btn primary" id="btn-screen">스크리닝</button>
      </div>
    </aside>

    <main class="main">
      <header class="main-head">
        <button type="button" class="menu-btn" id="menu-btn" aria-label="사이드바 열기" title="필터 / 검색">☰</button>
        <h1>종목 스크리너</h1>
        <p class="status" id="status">준비됨</p>
      </header>

      <div class="list-wrap">
        <div class="sticky-head desktop-only" id="list-head"></div>
        <div id="list-body" class="list-body"></div>
        <div id="cards-body" class="cards-body"></div>
      </div>
    </main>
  </div>

  <div class="overlay" id="sidebar-overlay" hidden></div>

  <dialog id="detail-modal" class="detail-modal">
    <form method="dialog" class="detail-close-row">
      <button value="close" class="btn ghost">닫기</button>
    </form>
    <div id="detail-content"></div>
  </dialog>

  <dialog id="portfolio-modal" class="portfolio-modal">
    <form method="dialog" class="detail-close-row">
      <button value="close" class="btn ghost">닫기</button>
    </form>
    <h2 class="portfolio-title">내 포트폴리오</h2>
    <p class="muted portfolio-lead">영문 이름과 숫자 4자리 비밀번호로 즐겨찾기를 개인별로 저장합니다.</p>
    <label class="field-label" for="pf-name">이름 (영문)</label>
    <input id="pf-name" type="text" maxlength="20" placeholder="예: kumo" autocomplete="username" />
    <label class="field-label" for="pf-pin">비밀번호 (숫자 4자리)</label>
    <input id="pf-pin" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]*" placeholder="••••" autocomplete="current-password" />
    <p class="portfolio-error" id="pf-error" hidden></p>
    <div class="portfolio-actions">
      <button type="button" class="btn primary" id="pf-login">들어가기</button>
      <button type="button" class="btn" id="pf-create">새로 만들기</button>
    </div>
  </dialog>

  <script src="/static/app.js"></script>
</body>
</html>
